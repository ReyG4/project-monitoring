<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - AC Dikari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/app/app.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <h1 class="h3 mb-1">Dashboard</h1>
    <p class="text-muted mb-4">Ringkasan seluruh proyek dan aktivitas penting.</p>
    <div id="alert" class="alert alert-danger d-none"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
        <div class="text-muted small">Total proyek</div>
        <div class="display-6 fw-bold" id="d-total">0</div>
        <div class="small text-muted" id="d-total-sub">&nbsp;</div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
        <div class="text-muted small">Progres rata-rata</div>
        <div class="display-6 fw-bold text-primary" id="d-average">0%</div>
        <div class="small text-muted">dari seluruh proyek</div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
        <div class="text-muted small">Tugas terlambat</div>
        <div class="display-6 fw-bold text-danger" id="d-overdue">0</div>
        <div class="small text-muted">perlu perhatian</div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
        <div class="text-muted small">Menunggu review tester</div>
        <div class="display-6 fw-bold" id="d-waiting">0</div>
        <div class="small text-muted">proyek diajukan</div>
      </div></div></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 mb-3">Progres proyek</h2>
          <div id="d-projects"></div>
          <p id="d-projects-empty" class="text-muted small d-none mb-0">Belum ada proyek.</p>
        </div></div>
      </div>
      <div class="col-lg-5">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6 mb-3">Aktivitas terlambat</h2>
          <div id="d-overdue-list"></div>
          <p id="d-overdue-empty" class="text-muted small d-none mb-0">Tidak ada tugas yang terlambat.</p>
        </div></div>
      </div>
    </div>
  </main>

  <script src="/app/api.js"></script>
  <script src="/app/layout.js"></script>
  <script src="/app/dashboard.js"></script>
</body>
</html>
