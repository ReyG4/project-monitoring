<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyek - AC Dikari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/app/app.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h1 class="h3 mb-1">Semua Proyek</h1>
        <p class="text-muted mb-0">Kelola dan pantau perkembangan seluruh proyek dalam satu tempat.</p>
      </div>
      <button id="btn-add" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#modal-project">+ Tambah Proyek</button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-7">
        <input id="search" class="form-control" placeholder="Cari nama proyek..." aria-label="Cari proyek">
      </div>
      <div class="col-md-3">
        <select id="status-filter" class="form-select" aria-label="Filter status">
          <option value="">Semua status</option>
          <option value="perencanaan">Perencanaan</option>
          <option value="berjalan">Berjalan</option>
          <option value="diajukan">Diajukan</option>
          <option value="revisi">Revisi</option>
          <option value="selesai">Selesai</option>
        </select>
      </div>
    </div>

    <div id="alert" class="alert alert-danger d-none"></div>
    <div id="grid" class="row g-3"></div>
    <p id="empty" class="text-muted d-none">Belum ada proyek yang sesuai.</p>
  </main>

  <div class="modal fade" id="modal-project" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="project-form">
        <div class="modal-header">
          <h2 class="modal-title h5">Tambah Proyek</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <div id="form-alert" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label" for="f-name">Nama proyek</label>
            <input class="form-control" id="f-name" maxlength="255" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="f-desc">Deskripsi</label>
            <textarea class="form-control" id="f-desc" rows="3"></textarea>
          </div>
          <div class="row g-2">
            <div class="col">
              <label class="form-label" for="f-start">Tanggal mulai</label>
              <input type="date" class="form-control" id="f-start">
            </div>
            <div class="col">
              <label class="form-label" for="f-end">Deadline</label>
              <input type="date" class="form-control" id="f-end">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app/api.js"></script>
  <script src="/app/layout.js"></script>
  <script>
    const STATUS = {
      perencanaan: ['Perencanaan', 'bg-warning-subtle text-warning-emphasis'],
      berjalan: ['Berjalan', 'bg-primary-subtle text-primary-emphasis'],
      diajukan: ['Diajukan', 'bg-info-subtle text-info-emphasis'],
      revisi: ['Revisi', 'bg-danger-subtle text-danger-emphasis'],
      selesai: ['Selesai', 'bg-success-subtle text-success-emphasis'],
    };

    let projects = [];

    function card(project) {
      const [label, badgeClass] = STATUS[project.status] || [project.status, 'bg-secondary-subtle'];
      const progress = Math.round(project.progress ?? 0);

      return el('div', { class: 'col-md-6' },
        el('div', {
          class: 'card card-project h-100',
          onclick: () => { window.location.href = '/app/project.html?id=' + project.id; },
        },
          el('div', { class: 'card-body' },
            el('div', { class: 'd-flex justify-content-between align-items-center mb-2' },
              el('span', { class: 'text-muted small' }, 'Proyek #' + project.id),
              el('span', { class: 'badge rounded-pill ' + badgeClass }, label)
            ),
            el('h2', { class: 'h5 mb-3' }, project.name),
            el('div', { class: 'd-flex justify-content-between small mb-1' },
              el('span', { class: 'text-muted' }, 'Progres proyek'),
              el('strong', {}, progress + '%')
            ),
            el('div', { class: 'progress mb-3' },
              el('div', { class: 'progress-bar', role: 'progressbar', style: 'width:' + progress + '%' })
            ),
            el('div', { class: 'small text-muted' }, 'Deadline: ' + formatDate(project.target_end_date))
          )
        )
      );
    }

    function render() {
      const keyword = document.getElementById('search').value.trim().toLowerCase();
      const status = document.getElementById('status-filter').value;

      const visible = projects.filter((project) =>
        project.name.toLowerCase().includes(keyword) && (status === '' || project.status === status)
      );

      document.getElementById('grid').replaceChildren(...visible.map(card));
      document.getElementById('empty').classList.toggle('d-none', visible.length > 0);
    }

    async function loadProjects() {
      const alertBox = document.getElementById('alert');
      alertBox.classList.add('d-none');

      try {
        const result = await api('/projects');
        projects = result.data;
        render();
      } catch (error) {
        alertBox.textContent = error.message;
        alertBox.classList.remove('d-none');
      }
    }

    async function saveProject(event) {
      event.preventDefault();

      const formAlert = document.getElementById('form-alert');
      const button = document.getElementById('btn-save');
      formAlert.classList.add('d-none');
      button.disabled = true;

      try {
        await api('/projects', {
          method: 'POST',
          body: {
            name: document.getElementById('f-name').value,
            description: document.getElementById('f-desc').value,
            start_date: document.getElementById('f-start').value,
            target_end_date: document.getElementById('f-end').value,
          },
        });

        bootstrap.Modal.getOrCreateInstance(document.getElementById('modal-project')).hide();
        document.getElementById('project-form').reset();
        await loadProjects();
      } catch (error) {
        formAlert.textContent = Object.values(error.errors).flat().join(' ') || error.message;
        formAlert.classList.remove('d-none');
      } finally {
        button.disabled = false;
      }
    }

    if (requireLogin()) {
      renderSidebar('projects');

      if (currentUser().role === 'project_manager') {
        document.getElementById('btn-add').classList.remove('d-none');
      }

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('status-filter').addEventListener('change', render);
      document.getElementById('project-form').addEventListener('submit', saveProject);
      loadProjects();
    }
  </script>
</body>
</html>
