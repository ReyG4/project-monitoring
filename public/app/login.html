<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Project Monitoring AC Dikari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">AC Dikari</h1>
        <p class="text-muted mb-4">Project Monitoring</p>

        <div id="alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="submit-btn">Masuk</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/app/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const button = document.getElementById('submit-btn');

    function showError(message) {
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      alertBox.classList.add('d-none');
      button.disabled = true;

      try {
        const result = await api('/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });

        sessionStorage.setItem('token', result.token);
        sessionStorage.setItem('user', JSON.stringify(result.user));
        window.location.href = '/app/projects.html';
      } catch (error) {
        if (error.status === 429) {
          showError('Terlalu banyak percobaan. Tunggu satu menit lalu coba lagi.');
        } else if (error.status === 422) {
          showError(Object.values(error.errors).flat().join(' '));
        } else {
          showError(error.message);
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
