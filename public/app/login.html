<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Project Monitoring AC Dikari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/app/app.css" rel="stylesheet">
  <style>
    .login-wrap { display: flex; min-height: 100vh; }
    .login-hero {
      flex: 1 1 45%; color: #fff; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between;
      background-color: #12305c;
      background:
        linear-gradient(180deg, rgba(11, 31, 63, .92) 0%, rgba(18, 48, 92, .75) 55%, rgba(18, 48, 92, .55) 100%),
        url('/app/img/office.png') center bottom / cover no-repeat;
    }
    .login-logo { display: inline-flex; align-items: center; gap: .75rem; font-size: 1.15rem; }
    .login-logo span { width: 2.5rem; height: 2.5rem; border-radius: .7rem; background: rgba(255, 255, 255, .15);
      display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .login-side { flex: 1 1 55%; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fff; }
    .login-box { width: 100%; max-width: 400px; }
    @media (max-width: 768px) { .login-hero { display: none; } }
  </style>
</head>
<body>
  <div class="login-wrap">
    <section class="login-hero">
      <div class="login-logo"><span>A</span> AC Dikari</div>
      <div>
        <h1 class="display-5 fw-bold">Project<br>Monitoring</h1>
        <p class="fs-6 mb-0" style="color: #c9d6ee; max-width: 26rem;">
          Pantau, kelola, dan wujudkan setiap proyek menuju kesuksesan.
        </p>
      </div>
      <div></div>
    </section>

    <main class="login-side">
      <div class="login-box">
        <h2 class="h3 fw-bold mb-1">Selamat datang,</h2>
        <p class="text-muted mb-4">Silakan login untuk melanjutkan</p>

        <div id="alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control form-control-lg" id="email" placeholder="contoh@acdikari.com" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control form-control-lg" id="password" autocomplete="current-password" required>
              <button type="button" class="btn btn-outline-secondary" id="toggle-password" aria-label="Tampilkan password">Lihat</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100" id="submit-btn">Masuk</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/app/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const button = document.getElementById('submit-btn');
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');

    function showError(message) {
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    toggleButton.addEventListener('click', () => {
      const hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      toggleButton.textContent = hidden ? 'Sembunyi' : 'Lihat';
      toggleButton.setAttribute('aria-label', hidden ? 'Sembunyikan password' : 'Tampilkan password');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      alertBox.classList.add('d-none');
      button.disabled = true;

      try {
        const result = await api('/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: passwordInput.value,
          },
        });

        sessionStorage.setItem('token', result.token);
        sessionStorage.setItem('user', JSON.stringify(result.user));
        window.location.href = result.user.role === 'operator' ? '/app/users.html' : '/app/dashboard.html';
      } catch (error) {
        if (error.status === 429) {
          showError('Terlalu banyak percobaan. Tunggu satu menit lalu coba lagi.');
        } else if (error.status === 422) {
          showError(Object.values(error.errors).flat().join(' '));
        } else {
          showError(error.message);
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
